        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');

            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'danger' ? 'bg-red-600' : 'bg-slate-800';

            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span>${message}</span>`;

            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);

        function resizeImage(file, maxWidth, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/png', 0.8));
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function exportTableToExcel(tableID, filename = '') {
            let tableSelect = document.getElementById(tableID);
            let cloneTable = tableSelect.cloneNode(true);
            let ths = cloneTable.querySelectorAll('th.no-export');
            let tds = cloneTable.querySelectorAll('td.no-export');
            ths.forEach(el => el.remove()); tds.forEach(el => el.remove());
            let wb = XLSX.utils.table_to_book(cloneTable, {sheet:"Sheet1"});
            filename = filename ? filename + '.xlsx' : 'ExportData.xlsx';
            XLSX.writeFile(wb, filename);
        }

                        <input type="date" id="filterDate" value="${currentFilterDate}" onchange="updateFilterState(); ${onChangeFnName}()" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-medium focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                `;
            }

            return `
                <div class="flex flex-wrap gap-2 items-end">
                    ${dateFilterHTML}
                    <div class="flex-1 min-w-[120px]">
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Bulan</label>
                        <select id="filterMonth" onchange="updateFilterState(); ${onChangeFnName}()" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-medium focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                            <option value="all">-- Semua Bulan --</option>
                            ${monthOpts}
                        </select>
                    </div>
                    <div class="flex-1 min-w-[100px]">
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Tahun</label>
                        <select id="filterYear" onchange="updateFilterState(); ${onChangeFnName}()" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs font-medium focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                            ${yearOpts}
                        </select>
                    </div>
                    ${includeDate ? `
                    <div class="flex-none">
                        <button onclick="clearFilterDate(); ${onChangeFnName}()" class="px-3 py-2 border border-slate-300 rounded-xl bg-white hover:bg-slate-100 text-slate-600 text-xs font-bold transition" title="Hapus Filter Tanggal"><i class="fa-solid fa-rotate-left"></i> Reset</button>
                    </div>
                    ` : ''}
                </div>
            `;
        }

        function updateFilterState() {
            const m = document.getElementById('filterMonth').value;
            const y = document.getElementById('filterYear').value;
            const dEl = document.getElementById('filterDate');
            currentFilterDate = dEl ? dEl.value : '';
            
            currentFilterMonth = m === 'all' ? 'all' : parseInt(m);
            currentFilterYear = parseInt(y);
        }

        function clearFilterDate() {
            const dEl = document.getElementById('filterDate');
            if(dEl) { dEl.value = ''; currentFilterDate = ''; }
        }

        function isDateInFilter(dateString) {
            if(!dateString) return false;
            if (currentFilterDate && currentFilterDate !== '') return dateString === currentFilterDate;
            const d = new Date(dateString);
            const m = d.getMonth() + 1;
            const y = d.getFullYear();
            if (currentFilterMonth === 'all') return y === currentFilterYear;
            return m === currentFilterMonth && y === currentFilterYear;
        }

        function handleLogin(e) {
            e.preventDefault();
            const uInput = document.getElementById('loginUsername').value.trim();
            const pInput = document.getElementById('loginPassword').value.trim();
            const foundUser = usersData.find(u => u.username.toLowerCase() === uInput.toLowerCase() && u.password === pInput);

            if (foundUser) {
                currentUser = foundUser;
                showToast(`Selamat datang, ${currentUser.name}!`, 'success');
                renderApp();
            } else {
                showToast('Username atau password salah!', 'danger');
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('appScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginForm').reset();
            showToast('Anda telah keluar dari sistem', 'info');
        }

        function renderApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');

            document.getElementById('navUserName').innerText = currentUser.name;
            document.getElementById('navUserBadge').innerText = currentUser.role === 'admin' ? 'ADMIN' : 'STAFF';
            document.getElementById('navUserBadge').className = currentUser.role === 'admin' ? 
                'inline-block text-[10px] px-2 py-0.5 rounded-full font-bold bg-purple-900/60 text-purple-300 border border-purple-500/30 mt-0.5' : 
                'inline-block text-[10px] px-2 py-0.5 rounded-full font-bold bg-emerald-900/60 text-emerald-300 border border-emerald-500/30 mt-0.5';

            activeTab = currentUser.role === 'staff' ? 'biaya' : 'dashboard';
            renderSidebarNav();
            switchTab(activeTab);
            startLiveClock();
        }

        function renderSidebarNav() {
            const nav = document.getElementById('sidebarNav');
            let items = currentUser.role === 'staff' ? [{ id: 'biaya', icon: 'fa-receipt', label: 'Biaya Operasional' }] : [
                { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard Utama' },
                { id: 'pembelian', icon: 'fa-cart-shopping', label: 'Beli Pemasok' },
                { id: 'penjualan', icon: 'fa-file-invoice-dollar', label: 'Jual Konsumen' },
                { id: 'biaya', icon: 'fa-receipt', label: 'Biaya Operasional' },
                { id: 'bayar_pembelian', icon: 'fa-hand-holding-dollar', label: 'Hutang Pemasok' },
                { id: 'bayar_penjualan', icon: 'fa-money-bill-transfer', label: 'Piutang Konsumen' },
                { id: 'master', icon: 'fa-database', label: 'Master Data' }
            ];

            nav.innerHTML = items.map(item => `
                <button onclick="switchTab('${item.id}'); if(window.innerWidth < 768) toggleMobileNav();" class="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-xs font-bold transition ${activeTab === item.id ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}">
                    <i class="fa-solid ${item.icon} w-5 text-center text-sm"></i><span>${item.label}</span>
                </button>
            `).join('');
        }

        function switchTab(tabId) {
            if (currentUser.role === 'staff' && tabId !== 'biaya') tabId = 'biaya';
            activeTab = tabId;
            renderSidebarNav();
            const container = document.getElementById('mainContainer');
            const pt = document.getElementById('pageTitle');

            switch (tabId) {
                case 'dashboard': pt.innerText = "Dashboard Keuangan"; renderDashboard(container); break;
                case 'pembelian': pt.innerText = "Data Pembelian Pemasok"; renderPembelianView(container); break;
                case 'penjualan': pt.innerText = "Data Penjualan Konsumen"; renderPenjualanView(container); break;
                case 'biaya': pt.innerText = "Biaya Operasional"; renderBiayaView(container); break;
                case 'bayar_pembelian': pt.innerText = "Hutang Pemasok & Tagihan"; renderBayarPembelianView(container); break;
                case 'bayar_penjualan': pt.innerText = "Piutang Konsumen & Invoice"; renderBayarPenjualanView(container); break;
                case 'master': pt.innerText = "Database Master System"; renderMasterView(container); break;
            }
        }

        function toggleMobileNav() {
            const sidebar = document.getElementById('sidebar');
            if(sidebar.classList.contains('-translate-x-full')) sidebar.classList.remove('-translate-x-full');
            else sidebar.classList.add('-translate-x-full');
        }

        function startLiveClock() {
            setInterval(() => {
                const now = new Date();
                const clock = document.getElementById('liveClock');
                if (clock) clock.innerText = now.toLocaleDateString('id-ID', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }) + ' ' + now.toLocaleTimeString('id-ID');
            }, 1000);
        }

        function renderDashboardHelper() { renderDashboard(document.getElementById('mainContainer')); }

            const totalPembelian = filteredPurchases.reduce((acc, p) => acc + (p.totalBeli || 0), 0);
            const totalPembelianKg = filteredPurchases.reduce((acc, p) => acc + (p.totalTonase || 0), 0);
            const totalPenjualan = filteredSales.reduce((acc, s) => acc + (s.totalJual || 0), 0);

                        <div class="p-3 bg-emerald-100 text-emerald-700 rounded-xl"><i class="fa-solid fa-filter text-lg"></i></div>

                        <div class="flex justify-between items-center">

        let currentMasterType = 'users';
        function changeMasterTab(type) {
            currentMasterType = type;
            ['users', 'pemasok', 'konsumen', 'sopir', 'nopol'].forEach(t => {
                const el = document.getElementById(`tab_${t}`);
                if(el) {

            const container = document.getElementById('masterContentContainer');
            let data = currentMasterType === 'users' ? usersData : masterData[currentMasterType];
            let thead = '', rows = '';

            if (currentMasterType === 'users') {
                thead = `<tr><th class="py-3 px-3">Nama</th><th class="py-3 px-3">Username</th><th class="py-3 px-3">Password</th><th class="py-3 px-3">Role</th><th class="py-3 px-3 text-right">Aksi</th></tr>`;

                thead = `<tr><th class="py-3 px-3">Nopol</th><th class="py-3 px-3">Jenis</th><th class="py-3 px-3">Sopir Default</th><th class="py-3 px-3 text-right">Aksi</th></tr>`;
                rows = data.map((d, i) => `<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="py-3 px-3 font-bold text-emerald-700">${d.nopol}</td><td class="py-3 px-3">${d.jenis}</td><td class="py-3 px-3">${d.sopirDefault || '-'}</td><td class="py-3 px-3 text-right"><button onclick="openMasterModal('nopol', ${i})" class="text-blue-600 mr-3"><i class="fa-solid fa-pen"></i></button><button onclick="deleteMasterData('nopol', ${i})" class="text-red-600"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('');

            container.innerHTML = `
                <div class="flex justify-between items-center mb-3">

                <div class="overflow-x-auto custom-scrollbar">

        function openMasterModal(type, editIndex = -1) {
            let item = editIndex >= 0 ? (type === 'users' ? usersData[editIndex] : masterData[type][editIndex]) : {};
            let title = editIndex >= 0 ? 'Edit Data' : 'Tambah Data';
            let formFields = '';
            
            if (type === 'users') {
                formFields = `
                    <div class="space-y-3">

        function saveMasterData(e, type, index) {
            e.preventDefault();
            let newData = {};
            if (type === 'users') {
                newData = { id: index >= 0 ? usersData[index].id : Date.now(), name: document.getElementById('m_name').value, username: document.getElementById('m_user').value, password: document.getElementById('m_pass').value, role: document.getElementById('m_role').value };
                if(index >= 0) usersData[index] = newData; else usersData.push(newData);
            } else if (type === 'nopol') {
                newData = { id: index >= 0 ? masterData.nopol[index].id : 'NPL-'+Date.now(), nopol: document.getElementById('m_nopol').value.toUpperCase(), jenis: document.getElementById('m_jenis').value, sopirDefault: document.getElementById('m_sopir').value };
                if(index >= 0) masterData.nopol[index] = newData; else masterData.nopol.push(newData);
            } else {
                newData = { id: index >= 0 ? document.getElementById('m_id').value : document.getElementById('m_id').value.toUpperCase(), nama: document.getElementById('m_nama').value, telepon: document.getElementById('m_telp').value, alamat: type !== 'sopir' ? document.getElementById('m_alamat').value : undefined };
                if(index >= 0) masterData[type][index] = newData; else masterData[type].push(newData);
            }
            saveData(); closeModal(); renderMasterContent(); showToast('Data master berhasil disimpan');
        }

            if(type === 'users' && usersData[index].username === 'admin') return showToast('User admin utama tidak bisa dihapus', 'danger');
            if(type === 'users') usersData.splice(index, 1); else masterData[type].splice(index, 1);

        function addTrxItemRow() { tempTransactionItems.push({ nopol: '', sopir: '', tonase: '', harga: '', operasional: '', subtotal: 0 }); renderTrxItems(); }
        function removeTrxItemRow(i) { tempTransactionItems.splice(i, 1); if(tempTransactionItems.length === 0) addTrxItemRow(); renderTrxItems(); }

        function renderTrxItems() {
            const container = document.getElementById('trxItemsContainer');
            if(!container) return;
            container.innerHTML = tempTransactionItems.map((item, i) => `
                <tr class="border-b">
                    <td class="p-1"><select onchange="onNopolChange(${i}, this.value)" class="w-full border p-1 rounded text-xs"><option value="">Pilih...</option>${masterData.nopol.map(n => `<option value="${n.nopol}" ${item.nopol===n.nopol?'selected':''}>${n.nopol}</option>`).join('')}</select></td>
                    <td class="p-1"><select id="sopir_row_${i}" onchange="updateTrxItem(${i}, 'sopir', this.value)" class="w-full border p-1 rounded text-xs"><option value="">Pilih...</option>${masterData.sopir.map(s => `<option value="${s.nama}" ${item.sopir===s.nama?'selected':''}>${s.nama}</option>`).join('')}</select></td>
                    <td class="p-1"><input type="number" placeholder="0" oninput="updateTrxItem(${i}, 'tonase', this.value)" value="${item.tonase||''}" class="w-full border p-1 rounded text-xs text-right focus:border-emerald-500 outline-none"></td>
                    <td class="p-1"><input type="number" placeholder="0" oninput="updateTrxItem(${i}, 'harga', this.value)" value="${item.harga||''}" class="w-full border p-1 rounded text-xs text-right focus:border-emerald-500 outline-none"></td>
                    <td class="p-1 bg-emerald-50"><input type="number" placeholder="0" oninput="updateTrxItem(${i}, 'operasional', this.value)" value="${item.operasional||''}" class="w-full border border-emerald-200 p-1 rounded text-xs text-right focus:border-emerald-500 outline-none"></td>
                    <td class="p-1 text-right font-bold text-slate-700" id="subtotal_row_${i}">${formatRp(item.subtotal)}</td>
                    <td class="p-1 text-center"><button type="button" onclick="removeTrxItemRow(${i})" class="text-red-500 hover:text-red-700 p-1"><i class="fa-solid fa-circle-minus"></i></button></td>
                </tr>
            `).join('');
            calculateTrxTotals();
        }

        function onNopolChange(i, val) {
            updateTrxItem(i, 'nopol', val);
            const nd = masterData.nopol.find(n => n.nopol === val);
            if(nd && nd.sopirDefault) { 
                const selectEl = document.getElementById(`sopir_row_${i}`);
                if (selectEl) { selectEl.value = nd.sopirDefault; }
                updateTrxItem(i, 'sopir', nd.sopirDefault); 
            }
        }

        function updateTrxItem(i, f, v) {
            if(['tonase','harga','operasional'].includes(f)) { 
                tempTransactionItems[i][f] = v === '' ? '' : (parseFloat(v)||0); 
                const ton = tempTransactionItems[i].tonase || 0;
                const hrg = tempTransactionItems[i].harga || 0;
                tempTransactionItems[i].subtotal = ton * hrg; 
            }
            else { tempTransactionItems[i][f] = v; }
            
            const subCell = document.getElementById(`subtotal_row_${i}`);
            if (subCell) subCell.innerText = formatRp(tempTransactionItems[i].subtotal);
            calculateTrxTotals(); 
        }

        function calculateTrxTotals() {
            let tKg=0, tRp=0, tOps=0;
            tempTransactionItems.forEach(i => { tKg+=(i.tonase||0); tRp+=(i.subtotal||0); tOps+=(i.operasional||0); });
            
            if(document.getElementById('beli_tot_kg')) document.getElementById('beli_tot_kg').innerText = formatKg(tKg);
            if(document.getElementById('beli_tot_ops')) document.getElementById('beli_tot_ops').innerText = formatRp(tOps);
            if(document.getElementById('beli_tot_rp')) document.getElementById('beli_tot_rp').innerText = formatRp(tRp);

            if(document.getElementById('jual_tot_kg')) document.getElementById('jual_tot_kg').innerText = formatKg(tKg);
            if(document.getElementById('jual_tot_rp')) document.getElementById('jual_tot_rp').innerText = formatRp(tRp);
        }

        function savePembelian() {
            const tgl = document.getElementById('beli_tanggal').value; 
            const pemasok = document.getElementById('beli_pemasok').value;
            if(!tgl || !pemasok) return showToast('Lengkapi data tanggal dan pemasok!', 'danger');
            const valid = tempTransactionItems.filter(i => i.nopol && (i.tonase||0) > 0 && (i.harga||0) > 0);
            if(valid.length === 0) return showToast('Minimal 1 armada valid (tonase & harga > 0)!', 'danger');
            let tBeli=0, tOps=0, tKg=0; valid.forEach(i => { tBeli+=i.subtotal; tOps+=(i.operasional||0); tKg+=i.tonase; });
            const id = document.getElementById('beli_id').value; const idx = purchasesData.findIndex(p => p.id === id);
            const dataToSave = { id, tanggal: tgl, pemasok, items: valid, totalBeli: tBeli, totalOperasional: tOps, totalTonase: tKg };
            if(idx >= 0) purchasesData[idx] = dataToSave; else purchasesData.unshift(dataToSave);
            saveData(); closeModal(); renderPembelianViewHelper(); showToast('Transaksi Pembelian Tersimpan!');
        }

        function renderBayarPenjualanViewHelper() { renderBayarPenjualanView(document.getElementById('mainContainer')); }

        function openPaymentModal(type, trxId) {
            const isHutang = type === 'hutang';
            const color = isHutang ? 'amber' : 'blue';
            const mainData = isHutang ? purchasesData : salesData;
            const payData = isHutang ? purchasePayments : salesPayments;
            
            const trx = mainData.find(t => t.id === trxId);
            if(!trx) return;
            
            const relatedPayments = payData.filter(p => p.trxId === trxId);
            const totalTagihan = isHutang ? trx.totalBeli : trx.totalJual;
            const totalDibayar = relatedPayments.reduce((acc, p) => acc + p.jumlah, 0);
            const sisa = Math.max(0, totalTagihan - totalDibayar);

            let paymentsListHtml = relatedPayments.length === 0 ? '<p class="text-xs text-slate-500 italic text-center py-2">Belum ada riwayat pembayaran.</p>' : 
                relatedPayments.map(p => `
                    <div class="flex justify-between items-center py-2 border-b border-slate-100 last:border-0">

                        <div class="text-right">

                            <button onclick="deletePayment('${type}', '${p.id}', '${trxId}')" class="text-[10px] text-red-500 hover:underline">Batal</button>
                        </div>
                    </div>
                `).join('');

            showModal(`
                <div>
                    <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-money-bill-wave text-${color}-600"></i> Kelola Pembayaran: ${trxId}</h3>
                    
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-4 grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-[10px] font-bold text-slate-500 uppercase">Pihak</p>
                            <p class="text-sm font-bold">${isHutang ? trx.pemasok : trx.konsumen}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] font-bold text-slate-500 uppercase">Total Tagihan</p>
                            <p class="text-sm font-bold">${formatRp(totalTagihan)}</p>
                        </div>
                    </div>

                    <div class="flex flex-col md:flex-row gap-6">
                        <div class="flex-1">
                            <h4 class="text-xs font-bold border-b-2 border-slate-200 pb-1 mb-3">Riwayat Pembayaran</h4>
                            <div class="max-h-40 overflow-y-auto custom-scrollbar pr-2">${paymentsListHtml}</div>
                            <div class="mt-4 pt-3 border-t border-slate-200 flex justify-between items-center">

                                <div><label class="block text-[11px] font-bold mb-1">Metode</label><select id="pay_method" class="w-full border p-2 rounded-lg text-xs"><option value="Transfer Bank BCA">Transfer Bank BCA</option><option value="Tunai / Cash">Tunai / Cash</option></select></div>
                                <div><label class="block text-[11px] font-bold mb-1">Nominal (Rp)</label><input type="number" id="pay_amount" required max="${sisa}" value="${sisa}" class="w-full border p-2 rounded-lg text-xs font-bold text-${color}-600"></div>
                                <button type="submit" class="w-full py-2 bg-${color}-600 hover:bg-${color}-700 text-white text-xs font-bold rounded-lg transition mt-2">Simpan Pembayaran</button>
                            </form>
                        </div>` : `<div class="flex-1 flex items-center justify-center"><div class="text-center p-6 bg-emerald-50 rounded-2xl border border-emerald-200"><i class="fa-solid fa-circle-check text-4xl text-emerald-500 mb-2"></i><p class="font-bold text-emerald-700">TAGIHAN LUNAS</p></div></div>`}
                    </div>
                    <div class="mt-6 flex justify-end pt-4 border-t"><button onclick="closeModal()" class="px-5 py-2.5 bg-slate-200 text-xs font-bold rounded-xl hover:bg-slate-300">Tutup</button></div>
                </div>

        function savePayment(e, type, trxId) {
            e.preventDefault();
            const date = document.getElementById('pay_date').value;
            const method = document.getElementById('pay_method').value;
            const amount = parseFloat(document.getElementById('pay_amount').value);
            if(!date || amount <= 0) return showToast('Data tidak valid', 'danger');

            const payList = type === 'hutang' ? purchasePayments : salesPayments;
            payList.push({ id: generateId('PAY'), trxId, tanggal: date, metode: method, jumlah: amount });
            
            saveData();
            showToast('Pembayaran berhasil dicatat!');
            openPaymentModal(type, trxId); // refresh
            if(type === 'hutang') renderBayarPembelianViewHelper(); else renderBayarPenjualanViewHelper();
        }

        function deletePayment(type, payId, trxId) {
            confirmAction('Batal Pembayaran', 'Yakin ingin menghapus riwayat pembayaran ini?', `executeDeletePayment('${type}', '${payId}', '${trxId}')`);
        }
        
        function executeDeletePayment(type, payId, trxId) {
            const payList = type === 'hutang' ? purchasePayments : salesPayments;
            const idx = payList.findIndex(p => p.id === payId);
            if(idx > -1) payList.splice(idx, 1);
            saveData(); showToast('Pembayaran dibatalkan');
            openPaymentModal(type, trxId);
            if(type === 'hutang') renderBayarPembelianViewHelper(); else renderBayarPenjualanViewHelper();
        }

        function deleteTransaksi(type, id) { confirmAction('Hapus Transaksi', 'Data akan dihapus permanen. Lanjutkan?', `executeDeleteTrx('${type}', '${id}')`); }
        function executeDeleteTrx(type, id) {
            if(type === 'beli') { purchasesData = purchasesData.filter(p => p.id !== id); purchasePayments = purchasePayments.filter(p => p.trxId !== id); renderPembelianViewHelper(); }
            else if(type === 'jual') { salesData = salesData.filter(s => s.id !== id); salesPayments = salesPayments.filter(p => p.trxId !== id); renderPenjualanViewHelper(); }
            else if(type === 'biaya') { expensesData = expensesData.filter(e => e.id !== id); renderBiayaViewHelper(); }
            saveData(); showToast('Transaksi berhasil dihapus');
        }

        
        // Handles Upload of Logo and Signature inside Invoice Modal
        function handleInvoiceSettingUpload(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            // Compress image aggressively to save localStorage space (max width 300px)
            resizeImage(file, 300, (base64) => {
                if(type === 'logo') {
                    storedLogoBase64 = base64;
                    localStorage.setItem('atma_logo_b64', base64);
                    const imgEl = document.getElementById('invLogoPreview');
                    if(imgEl) { imgEl.src = base64; imgEl.classList.remove('hidden'); }
                } else if (type === 'ttd') {
                    storedTtdBase64 = base64;
                    localStorage.setItem('atma_ttd_b64', base64);
                    const imgEl = document.getElementById('invTtdPreview');
                    if(imgEl) { imgEl.src = base64; imgEl.classList.remove('hidden'); }
                }
                showToast(type === 'logo' ? 'Logo diperbarui' : 'TTD diperbarui');
            });
        }

        function openInvoicePreviewModal(type, id) {
            const htmlContent = generateInvoiceHTML(type, id);
            
            showModal(`
                <div class="h-full flex flex-col max-h-[90vh]">
                    <div class="flex justify-between items-center mb-4 flex-shrink-0">
                        <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-file-pdf text-red-500 mr-2"></i> Pratinjau Invoice / Cetak</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
                    </div>
                    
                    <!-- Settings Panel (No Print) -->
                    <div class="no-print bg-slate-100 p-4 rounded-xl mb-4 flex flex-col md:flex-row gap-4 justify-between items-center border border-slate-200">
                        <div class="flex gap-4">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Unggah Logo PT</label>
                                <input type="file" accept="image/*" onchange="handleInvoiceSettingUpload(event, 'logo')" class="text-xs max-w-[180px]">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Unggah Tanda Tangan</label>
                                <input type="file" accept="image/*" onchange="handleInvoiceSettingUpload(event, 'ttd')" class="text-xs max-w-[180px]">
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2"><i class="fa-solid fa-print"></i> Print</button>
                            <button onclick="downloadPDF('${type}', '${id}')" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 shadow-md"><i class="fa-solid fa-download"></i> Unduh PDF</button>
                        </div>
                    </div>

                    <!-- Print Area Container -->
                    <div class="flex-1 overflow-y-auto modal-scrollbar bg-gray-200 p-2 sm:p-4 flex justify-center rounded-xl relative">
                        <div id="invoicePrintArea" class="relative">
                            ${htmlContent}
                        </div>
                    </div>
                </div>
            `);
        }

        function generateInvoiceHTML(type, id) {
            let data, items, invTitle, colorClass, targetLabel, targetName, bankInfoHtml = '', payInfoHtml = '';
            
            // Re-fetch data based on type for full details
            if (type === 'beli' || type === 'bayar_pembelian') {
                data = purchasesData.find(d => d.id === id);
                invTitle = type === 'beli' ? 'BUKTI PEMBELIAN BARANG' : 'INVOICE PEMBAYARAN HUTANG';
                colorClass = 'text-amber-700';
                targetLabel = 'Supplier / Pemasok:';
                targetName = data.pemasok;
                items = data.items;
                
                if(type === 'bayar_pembelian') {
                    const payments = purchasePayments.filter(p => p.trxId === id);
                    const paid = payments.reduce((sum, p) => sum + p.jumlah, 0);
                    const sisa = Math.max(0, data.totalBeli - paid);
                    payInfoHtml = `
                        <div class="mt-4 pt-3 border-t-2 border-slate-200">
                            <div class="flex justify-between text-xs mb-1"><span>Total Tagihan:</span><span class="font-bold">${formatRp(data.totalBeli)}</span></div>
                            <div class="flex justify-between text-xs mb-1"><span>Telah Dibayar:</span><span class="font-bold text-emerald-600">${formatRp(paid)}</span></div>
                            <div class="flex justify-between text-sm mt-2"><span>Sisa Hutang:</span><span class="font-bold text-red-600">${formatRp(sisa)}</span></div>
                        </div>
                    `;
                }
            } else if (type === 'jual' || type === 'bayar_penjualan') {
                data = salesData.find(d => d.id === id);
                invTitle = type === 'jual' ? 'FAKTUR PENJUALAN' : 'INVOICE TAGIHAN';
                colorClass = 'text-blue-700';
                targetLabel = 'Kepada Yth:';
                targetName = data.konsumen;
                items = data.items;
                
                bankInfoHtml = `
                    <div class="mt-5 p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                        <p class="font-bold mb-1 text-slate-700">Informasi Pembayaran (Transfer Bank):</p>
                        <p>Bank: <strong>BCA</strong></p>
                        <p>Rekening: <strong>1402255255</strong></p>
                        <p>Atas Nama: <strong>ATMAJAYA BHARATA UNGGAS</strong></p>
                    </div>
                `;

                if(type === 'bayar_penjualan') {
                    const payments = salesPayments.filter(p => p.trxId === id);
                    const paid = payments.reduce((sum, p) => sum + p.jumlah, 0);
                    const sisa = Math.max(0, data.totalJual - paid);
                    payInfoHtml = `
                        <div class="mt-4 pt-3 border-t-2 border-slate-200">
                            <div class="flex justify-between text-xs mb-1"><span>Total Tagihan:</span><span class="font-bold">${formatRp(data.totalJual)}</span></div>
                            <div class="flex justify-between text-xs mb-1"><span>Telah Dibayar:</span><span class="font-bold text-emerald-600">${formatRp(paid)}</span></div>
                            <div class="flex justify-between text-sm mt-2"><span>Sisa Tagihan:</span><span class="font-bold text-red-600">${formatRp(sisa)}</span></div>
                        </div>
                    `;
                }
            }
            if(!data) return '<p class="text-red-500">Data tidak ditemukan.</p>';

            const imgLogo = storedLogoBase64 ? `<img id="invLogoPreview" src="${storedLogoBase64}" style="max-height: 55px; max-width: 120px; object-fit: contain; margin-right: 15px;">` : `<img id="invLogoPreview" class="hidden" style="max-height: 55px; max-width: 120px; object-fit: contain; margin-right: 15px;">`;
            const imgTtd = storedTtdBase64 ? `<img id="invTtdPreview" src="${storedTtdBase64}" style="max-height: 70px; max-width: 150px; object-fit: contain; display: block; margin: 5px auto;">` : `<img id="invTtdPreview" class="hidden" style="max-height: 70px; max-width: 150px; object-fit: contain; display: block; margin: 5px auto;">`;

            let tableHtml = '';
            let isBeli = type.includes('beli');
            
            items.forEach((item, index) => {
                tableHtml += `
                    <tr>
                        <td class="text-center">${index + 1}</td>
                        <td class="font-bold text-slate-800">${item.nopol}</td>
                        <td>${item.sopir}</td>
                        <td class="text-right">${formatKg(item.tonase)}</td>
                        <td class="text-right">${formatRp(item.harga)}</td>
                        ${isBeli ? `<td class="text-right text-emerald-600">${formatRp(item.operasional || 0)}</td>` : ''}
                        <td class="text-right font-bold">${formatRp(item.subtotal)}</td>
                    </tr>
                `;
            });

            return `
                <div class="pdf-page bg-white relative">
                    <!-- Header -->
                    <div class="flex justify-between items-start border-b-2 border-slate-800 pb-4 mb-6">
                        <div class="flex items-center">
                            ${imgLogo}
                            <div>
                                <h1 class="text-lg font-extrabold text-slate-900 tracking-tight m-0" style="font-size: 18px; line-height: 1.2;">PT. ATMAJAYA BHARATA UNGGAS</h1>
                                <p class="text-slate-500 mt-1" style="font-size: 11px;">Perum Puri Gedangsewu Asri, Pare, Kab. Kediri</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <h2 class="font-extrabold ${colorClass} uppercase m-0" style="font-size: 20px; letter-spacing: 1px;">${invTitle}</h2>
                            <p class="font-bold text-slate-700 mt-1" style="font-size: 13px;">No: ${data.id}</p>
                            <p class="text-slate-500" style="font-size: 11px;">Tanggal: ${formatTanggal(data.tanggal)}</p>
                        </div>
                    </div>

                    <!-- Pihak Terkait -->
                    <div class="mb-6 bg-slate-50 p-4 rounded border border-slate-100">
                        <p class="text-[10px] font-bold text-slate-500 uppercase mb-1">${targetLabel}</p>
                        <p class="text-sm font-bold text-slate-900">${targetName}</p>
                    </div>

                    <!-- Detail Table -->
                    <table class="w-full text-left invoice-table mb-2">
                        <thead>
                            <tr>
                                <th class="text-center w-10">No</th>
                                <th>Armada/Nopol</th>
                                <th>Sopir</th>
                                <th class="text-right">Tonase (Kg)</th>
                                <th class="text-right">Harga/Kg</th>
                                ${isBeli ? '<th class="text-right">Biaya Ops</th>' : ''}
                                <th class="text-right">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableHtml}
                        </tbody>
                    </table>

                    <!-- Summary & Bank Info -->
                    <div class="flex flex-row justify-between items-start mt-6">
                        <div class="w-1/2 pr-4">
                            ${bankInfoHtml}
                        </div>
                        <div class="w-1/2 pl-4">
                            <div class="bg-slate-50 p-4 rounded border border-slate-200">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-bold text-slate-600">Total Tonase:</span>
                                    <span class="text-sm font-bold">${formatKg(data.totalTonase)}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-bold text-slate-600">TOTAL KESELURUHAN:</span>
                                    <span class="text-lg font-black ${colorClass}">${formatRp(isBeli ? data.totalBeli : data.totalJual)}</span>
                                </div>
                                ${payInfoHtml}
                            </div>
                        </div>
                    </div>

                    <!-- Footer & Signature -->
                    <div class="mt-12 flex justify-end">
                        <div class="text-center w-48">
                            <p class="text-xs text-slate-600 mb-1">Hormat kami,</p>
                            ${imgTtd}
                            ${!storedTtdBase64 ? '<div style="height: 60px;"></div>' : ''}
                            <p class="text-sm font-bold text-slate-900 border-b border-slate-400 inline-block pb-0.5">Zainal Abidin</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function downloadPDF(type, id) {
            const element = document.getElementById('invoicePrintArea');
            const filename = `Invoice_${type}_${id}.pdf`;
            
            const opt = {
                margin:       0,
                filename:     filename,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            
            showToast('Menyiapkan file PDF...', 'info');
            html2pdf().set(opt).from(element).save().then(() => {
                showToast('PDF berhasil diunduh!');
            });
        }

        function sendWA(type, id) {
            let data, target, prefix, text = '';
            if (type === 'beli') { data = purchasesData.find(d => d.id === id); target = masterData.pemasok.find(p => p.nama === data.pemasok); prefix = 'Pembelian'; }
            else if (type === 'jual') { data = salesData.find(d => d.id === id); target = masterData.konsumen.find(c => c.nama === data.konsumen); prefix = 'Tagihan Penjualan'; }
            
            if(!data || !target || !target.telepon) return showToast('Nomor WA tujuan tidak ditemukan di Master Data', 'danger');

            let hp = target.telepon.replace(/\D/g,'');
            if(hp.startsWith('0')) hp = '62' + hp.substring(1);

            let tot = type === 'beli' ? data.totalBeli : data.totalJual;
            text = `*INFORMASI ${prefix.toUpperCase()}*\nPT. ATMAJAYA BHARATA UNGGAS\n\nNo. Invoice: ${data.id}\nTanggal: ${formatTanggal(data.tanggal)}\nKepada: ${target.nama}\n\nTotal Tonase: ${formatKg(data.totalTonase)}\n*Total Nominal: ${formatRp(tot)}*\n\nTerima kasih.`;
            
            window.open(`https://wa.me/${hp}?text=${encodeURIComponent(text)}`, '_blank');
        }

    </script>
</body>
</html>
